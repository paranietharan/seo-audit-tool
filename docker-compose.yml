networks:
  seo-net:
    driver: bridge

services:
  audit-service:
    build: ./audit-service
    networks: [seo-net]
    environment:
      - PORT=8081
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  report-service:
    build: ./report-service
    networks: [seo-net]
    depends_on:
      audit-service:
        condition: service_healthy
    environment:
      - PORT=8082
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-2.0-flash
      - AUDIT_SERVICE_URL=http://audit-service:8081
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8082/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  api-gateway:
    build: ./api-gateway
    networks: [seo-net]
    depends_on:
      audit-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
    ports: ["8080:8080"]
    environment:
      - PORT=8080
      - AUDIT_SERVICE_URL=http://audit-service:8081
      - REPORT_SERVICE_URL=http://report-service:8082
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build: ./frontend
    networks: [seo-net]
    depends_on:
      - api-gateway
    ports: ["3000:80"]
