version: "3.9"

networks:
  seo-net:
    driver: bridge

services:
  audit-service:
    build: ./audit-service
    networks: [seo-net]
    environment:
      - PORT=8081

  report-service:
    build: ./report-service
    networks: [seo-net]
    depends_on: [audit-service]
    environment:
      - PORT=8082
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AUDIT_SERVICE_URL=http://audit-service:8081

  api-gateway:
    build: ./api-gateway
    networks: [seo-net]
    depends_on: [audit-service, report-service]
    ports: ["8080:8080"]
    environment:
      - PORT=8080
      - AUDIT_SERVICE_URL=http://audit-service:8081
      - REPORT_SERVICE_URL=http://report-service:8082

  frontend:
    build: ./frontend
    networks: [seo-net]
    depends_on: [api-gateway]
    ports: ["3000:80"]
